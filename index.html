量标准",d:{logic:2,order:1}},{t:"依靠过往经验和当下直觉先判断方向",d:{logic:-2,risk:1,spark:1}},{t:"先听取关键成员意见，形成共识后再决定",d:{heart:2,spark:1}}],why:"我需要可以落地的衡量标准。"},{id:"w4",s:1,focus:"问题诊断与止损",q:"项目推进到中段，数据表明原方案的关键假设不成立，而且已经投入两周。你会怎样处理？",opts:[{t:"先完成当前版本，避免前期投入浪费，之后再统一复盘",d:{risk:-2,order:1,pace:-1}},{t:"立即推倒重来，不再纠结原方案哪里出了问题",d:{risk:2,pace:2,logic:-1,order:-1}},{t:"先定位漏洞和影响范围，再快速判断修复、调整还是终止，并同步新方案",d:{logic:2,pace:1,order:1,risk:1}}],why:"我极其擅长“放弃”与重启，尽量避免沉溺于沉没成本。"},{id:"w5",s:1,focus:"高压执行状态",q:"在连续高压、任务排满的阶段，你最接近哪种真实状态？",opts:[{t:"明显感到被消耗，只想尽快停下来恢复",d:{pace:-2,heart:-1,risk:-1}},{t:"越忙越兴奋，主要享受不断攻克挑战的过程",d:{pace:2,risk:1,spark:1}},{t:"既紧张又兴奋，进入执行后反而会专注、克制地一项项完成",d:{pace:1,logic:1,order:1,heart:1}}],why:"我喜欢挑战，但实际处于执行阶段时，精神是处于麻木的平静之中的，害怕无法达到预期，所以不敢浪费一点时间。"},{id:"w6",s:1,focus:"信任建立与承诺判断",q:"上级描绘了很有吸引力的远期规划，但近期资源尚未落实。你会怎样判断？",opts:[{t:"先把它当作激励，保持投入，后续边走边看",d:{heart:1,spark:1,logic:-1}},{t:"暂不下结论，主要观察后续行动、资源投入和实际兑现",d:{logic:2,order:1,spark:-1}},{t:"只按已经确定的利益、规则和核心价值评估，不为远期承诺预支投入",d:{logic:1,spark:2,risk:1}}],why:"言语的担保从来不信，我会自己找好后路。"},{id:"w7",s:1,focus:"规则意识与证据管理",q:"合作方没有按约交付，沟通多次仍在推诿。你通常怎样推进？",opts:[{t:"集中沟通施压，先把情绪和态度表达清楚",d:{spark:2,heart:1,logic:-1,pace:1}},{t:"留存合同、记录和沟通证据，按平台或官方流程投诉处理",d:{logic:2,order:2}},{t:"先内部补位止损，纠纷等项目结束后再处理",d:{pace:1,risk:-1,heart:1}}],why:"规则化维权，吵闹没用，证据说话。"},{id:"w8",s:1,focus:"信息表达与文档交付",q:"需要向同事交付一份工作文档时，你更重视哪种形态？",opts:[{t:"结构完整、表达精致，阅读体验也要照顾到",d:{spark:1,order:1,pace:-1}},{t:"极简干货，先给结论、依据和可执行步骤",d:{logic:1,pace:1,order:1}},{t:"图表和演示优先，尽量让对方一眼看懂",d:{spark:2,heart:1,pace:-1}}],why:"有审美要求，但目前的执行审美和理想审美相差甚远。"},{id:"w9",s:1,focus:"流程优化与工具突破",q:"现有软件或流程明显限制效率，短期内又无法更换时，你会？",opts:[{t:"先按原流程执行，保证业务不被额外改造拖慢",d:{risk:-1,pace:-1,order:1}},{t:"在合规范围内研究替代办法、写脚本或提出系统优化方案",d:{risk:1,logic:2,pace:1,spark:1}},{t:"整理痛点和收益测算，推动负责人更换工具",d:{spark:2,logic:1,pace:-1}}],why:"被迫浪费我的时间，真的会让我非常不爽，有能力的话，我不介意做额外工作为流程赋能，一劳永逸。"},{id:"w10",s:1,focus:"成长支持与向上协作",q:"进入新岗位或新领域时，你最理想的成长支持是？",opts:[{t:"有人系统带教，把步骤和标准逐步讲清楚",d:{heart:2,order:1,pace:-1}},{t:"主要靠自己研究案例、提炼模型，遇到关键问题再请教",d:{logic:2,risk:1,heart:-1}},{t:"有人提供方向和兜底，但日常探索与执行由自己负责",d:{heart:1,order:1,logic:1}}],why:"我需要有人在背后的安全感，但非必要不会打扰我的上级。"},{id:"w11",s:1,focus:"压力调节与专注管理",q:"临近重大截止时间、焦虑明显上升时，你更可能怎样恢复执行状态？",opts:[{t:"找信任的人倾诉，先释放情绪再回来工作",d:{heart:2,spark:1,pace:-1}},{t:"戴上耳机独处，把注意力集中到输出和具体任务上",d:{heart:-1,order:1,pace:1,logic:1}},{t:"暂时离开工作场景，休息或运动后再重新进入",d:{pace:-1,order:1}}],why:"听歌纯粹为了鼓点，赶 DDL 时它是让我平静的工具，手头上有时间任务时，情绪不在我的考虑范围内。"},{id:"w12",s:1,focus:"AI 应用与数字化学习",q:"面对 AI 工具，你更接近哪种使用方式？",opts:[{t:"临时查询和辅助写作，需要时用一下即可",d:{pace:1,logic:-1,order:-1}},{t:"持续研究并嵌入工作流，让它承担检索、整理或自动化任务",d:{logic:2,risk:1,pace:1}},{t:"保持谨慎，先验证准确性和边界，再决定是否使用",d:{risk:-2,logic:1,order:1}}],why:"劳动市场的需求不满足？还想找到工作吗？"},{id:"w13",s:1,focus:"证据意识与会议沟通",q:"会议上有人提出一个听起来宏大、但缺少数据和路径的概念时，你通常会？",opts:[{t:"先肯定方向，避免在不完整阶段过早否定",d:{heart:1,logic:-2,spark:-1}},{t:"追问具体的落地路径、负责人和衡量标准",d:{logic:2,spark:2}},{t:"先记录为待验证假设，会后用资料和数据判断",d:{order:1,logic:1}}],why:"空泛的行业黑话，请给出证据。"},{id:"w14",s:1,focus:"自动化与效率意识",q:"一项机械重复工作预计还会持续几个月，你会优先怎样处理？",opts:[{t:"按标准耐心完成，先保证稳定交付",d:{order:1,pace:-1,risk:-1}},{t:"先摸清规则，再尝试模板化或用 AI、脚本实现自动化",d:{logic:1,pace:2,risk:1}},{t:"与同事重新分工，让重复工作轮换完成",d:{heart:1,pace:1}}],why:"没接触过就上手了解，熟悉逻辑之后就没必要浪费时间了。"},{id:"w15",s:1,focus:"交付导向与团队补位",q:"同组队友因失误导致进度延误，距离交付只剩很短时间。你会先做什么？",opts:[{t:"先安抚对方情绪，避免团队氛围进一步紧张",d:{heart:2,spark:-1,logic:-1}},{t:"直接定位问题，给出补救方案，并根据情况共同补位",d:{logic:2,pace:1,spark:1,heart:1}},{t:"立即同步负责人，请求调整资源或交付范围",d:{spark:1,order:1,heart:-1}}],why:"我连朋友吐槽都直接给规划，职场里紧急情况下更别指望我关注你的情绪。"},{id:"w16",s:2,focus:"长期规划与投入产出",q:"负责一个周期较长的项目时，你更倾向怎样做计划？",opts:[{t:"先定大致方向，保留较大弹性，走一步看一步",d:{order:-2,pace:1,risk:1}},{t:"拆清阶段、节点和投入产出，再按计划推进与复盘",d:{order:2,logic:2}},{t:"只锁定关键里程碑，中间路径由执行者灵活处理",d:{order:1,pace:1,heart:1}}],why:"计划不细化到可执行，相当于没做。"},{id:"w17",s:2,focus:"新技能学习路径",q:"学习一项全新的专业技能时，你通常从哪里开始？",opts:[{t:"先系统看教程、案例和他人经验，建立基本认知再练习",d:{order:1,logic:1,pace:-1,heart:1}},{t:"先做一个真实项目，在问题中反查文档和资料",d:{pace:2,risk:2,logic:1}},{t:"找一套有反馈机制的课程或导师，按节奏跟学",d:{heart:1,order:1}}],why:"先看看吧，东西怎么用都不知道，学啥？"},{id:"w18",s:2,focus:"学习模式与协作偏好",q:"需要吃透一个复杂主题时，哪种学习方式更有利于你形成判断？",opts:[{t:"多人讨论，在观点碰撞中互相启发",d:{heart:2,spark:2}},{t:"先独立安静研究，把资料系统翻完，再与人讨论验证",d:{heart:-2,logic:2,order:1}},{t:"向一两位专家请教，借他们的框架快速理解",d:{heart:1,logic:1,pace:1}}],why:"第一个很有吸引力，但对于我来说只适合用于成型之后的优化。"},{id:"w19",s:2,focus:"知识沉淀与成果复用",q:"如果你被邀请分享一次成功经验，你更愿意怎样准备？",opts:[{t:"讲几个真实故事和关键转折，方便大家代入",d:{spark:1,pace:1,logic:-1,heart:1}},{t:"梳理成可复用的系统模板，让别人能直接照着落地",d:{order:2,logic:2,spark:1}},{t:"以问答为主，根据听众问题现场拆解",d:{heart:1,spark:1,pace:1}}],why:"我习惯一边实操一边蒸馏，找我分享经验，有机会随机掉落意外之喜哦。"},{id:"w20",s:2,focus:"压力复盘与自我调节",q:"当压力接近上限、情绪开始影响判断时，你常用的自救方式是？",opts:[{t:"先暂停工作，用休息、消费或社交转移注意力",d:{heart:1,pace:-1,risk:1}},{t:"把问题按维度拆开分析，逐步把自己说服并恢复秩序",d:{logic:2,order:1,heart:-1}},{t:"找人完整倾诉，让情绪先被接住再处理问题",d:{heart:2,spark:1}}],why:"我经常在脑袋里分析，思考着就把自己气消了。"},{id:"w21",s:2,focus:"专家学习与资源利用",q:"有机会接触一位行业专家时，你最想获得什么？",opts:[{t:"合影、联系方式和后续请教的机会",d:{heart:1,spark:1,logic:-1}},{t:"他的判断框架、踩坑经验和解决问题的思路",d:{logic:2,spark:1}},{t:"行业趋势和资源信息，帮助自己规划下一步",d:{heart:1,order:1,logic:1}}],why:"实用主义至上，照片能干啥。"},{id:"w22",s:2,focus:"不确定性管理与备选方案",q:"面对考研、求职或项目审批这类结果不确定的事项时，你通常会？",opts:[{t:"持续收集他人经验，希望借此降低焦虑",d:{heart:1,pace:-1,logic:-1}},{t:"查官方数据、计算概率、寻找信息差，并提前制定 Plan B",d:{logic:2,order:2,risk:1}},{t:"先专注于能控制的准备工作，结果出来再调整",d:{order:1,pace:1,heart:1}}],why:"极度讨厌不可控的悬而未决，用数据说话。"},{id:"w23",s:2,focus:"信息组织与工作秩序",q:"你的电脑文件和工作资料通常处于什么状态？",opts:[{t:"放置比较随手，需要时主要依靠搜索找回",d:{order:-2,pace:1}},{t:"有严密的文件夹体系、命名规则和版本管理",d:{order:2,logic:1}},{t:"平时会特别处理重点资料，并定期集中整理一次",d:{order:1,pace:1}}],why:"我的收纳目前仍处于理想很美好现实很骨感的阶段。"},{id:"w24",s:2,focus:"目标管理与授权方式",q:"当你负责带领一个小团队时，你更倾向怎样管理？",opts:[{t:"充分放权，成员自由发挥，我主要看最后结果",d:{heart:2,risk:1,order:-1}},{t:"规定完整流程和检查节点，持续跟进，避免偏离目标",d:{order:2,spark:1,pace:1,heart:-1}},{t:"约定重要节点和交付时间，具体执行方法给成员自由",d:{order:1,heart:1,logic:1}}],why:"只要成果交付后有足够的时间优化，随便撒野，我不在意。"},{id:"w25",s:2,focus:"社交投入与资源判断",q:"一项跨部门活动内容偏空泛、与你当前工作关系不大时，你会怎样投入？",opts:[{t:"仍会参加，维护关系本身也是职场职责的一部分",d:{heart:1,order:1,spark:-1}},{t:"明确拒绝，把时间留给工作、学习或恢复状态",d:{heart:-2,pace:1,spark:1}},{t:"选择性参加，优先考虑能否获得信息、资源或实际价值",d:{logic:1,heart:1,pace:1}}],why:"吃到就是赚到！"},{id:"w26",s:2,focus:"反馈接受与改进速度",q:"教授或上级当众指出你的方案存在明显问题时，你通常会？",opts:[{t:"先感到难堪，需要一段时间消化面子和情绪",d:{heart:-1,pace:-2,spark:-1}},{t:"先确认问题是否成立，成立就立即复盘并优化方案",d:{logic:1,order:1,pace:1}},{t:"当场解释设计背景，避免对方因信息不全误判",d:{spark:2,logic:1,heart:1}}],why:"解决问题最重要。"},{id:"w27",s:2,focus:"成本意识与工具选型",q:"为团队选择一款付费工具时，你最先评估什么？",opts:[{t:"品牌、口碑和同行使用率，先降低选错的风险",d:{spark:1,logic:-1,risk:-1,heart:1}},{t:"核心参数、功能边界和技术逻辑是否匹配需求",d:{logic:2,order:1}},{t:"总成本、适配场景，以及是否有能解决具体问题的特色功能",d:{logic:1,pace:1}}],why:"不好意思，没有多余的钱为无关紧要的东西买单。"},{id:"w28",s:2,focus:"专业判断与证据标准",q:"在专业判断中，你通常最信任哪类依据？",opts:[{t:"自己或同行积累的经验直觉",d:{logic:-2,risk:1}},{t:"可核查的经验数据、官方披露和明文规则",d:{logic:2,order:1}},{t:"领域专家的一致意见，哪怕原始数据不完整",d:{heart:1,logic:1}}],why:"没有明文规定的东西，我很难相信。"},{id:"w29",s:2,focus:"问题导向沟通",q:"同事向你抱怨项目推进困难时，你第一反应更接近哪一句？",opts:[{t:"“听起来确实很难，你先缓一缓。”",d:{heart:2,spark:-1}},{t:"“你下一步打算怎么处理？需要我帮你查什么？”",d:{logic:2,spark:1,heart:-1}},{t:"“我们先把卡点列出来，再看需要同步给谁。”",d:{order:1,logic:1,pace:1}}],why:"我很扫兴，我只想给解决方案。"},{id:"w30",s:2,focus:"成就动机与持续进取",q:"一个方案顺利落地并取得很好的结果后，你通常会怎样收尾？",opts:[{t:"公开庆祝和分享，让团队都感受到成果",d:{spark:2,heart:1}},{t:"复盘并固化流程，形成下次可复用的模板",d:{order:2,logic:1}},{t:"享受完成挑战的满足感，然后较快转入下一个目标",d:{pace:2,spark:1}}],why:"享受完成挑战的快感，然后继续下一个。"},{id:"w31",s:2,focus:"状态管理与可持续投入",q:"连续学习或工作到深夜，面对复杂数据时，你更倾向怎样安排？",opts:[{t:"明显痛苦时就停下来，不勉强自己继续消耗",d:{pace:-2,heart:-1}},{t:"容易沉浸进去，把攻克复杂问题本身当成享受",d:{logic:1,order:1,pace:1}},{t:"先保证睡眠和状态，第二天再以更高效率迎接挑战",d:{order:1,pace:1}}],why:"受虐也是一种精神的淬炼。"},{id:"w32",s:2,focus:"挑战偏好与工作强度",q:"在两类岗位状态之间，你更偏好哪一种？",opts:[{t:"节奏舒适稳定，工作与生活边界清晰",d:{pace:-2,order:1,risk:-1}},{t:"能持续接触新项目，并接受较高强度的挑战",d:{pace:2,risk:1}},{t:"平时稳定，但在关键项目期可以集中冲刺",d:{order:1,pace:1,heart:1}}],why:"太闲我会疯，忙起来才踏实。"},{id:"w33",s:2,focus:"成长机会与环境适应",q:"有一个去偏远地区工作的机会，条件一般，但能接触核心技术。你会怎样决定？",opts:[{t:"拒绝，生活与工作环境对状态影响太大",d:{risk:-2,pace:-1,heart:-1}},{t:"只要确实能学到核心本事，可以接受阶段性的环境不便",d:{risk:2,pace:1}},{t:"先确认周期、支持条件和成长收益，再做决定",d:{logic:1,order:1}}],why:"对远程/灵活办公接受度高，看重产出。"},{id:"w34",s:2,focus:"学习广度与跨界能力",q:"在本职工作之外学习一个新领域时，你通常持什么态度？",opts:[{t:"随时可以尝试，能力组合越丰富越有意思",d:{risk:2,pace:1,spark:1}},{t:"先评估投入产出，性价比太低就不学",d:{logic:1,order:1,risk:-1}},{t:"只学与当前目标能形成协同的内容",d:{order:2,logic:1}}],why:"啥都会不觉得很爽吗，但前提是分内的事情要做好。"},{id:"w35",s:2,focus:"商业洞察与模型提炼",q:"拆解一个复杂商业案例时，哪一部分最能给你成就感？",opts:[{t:"最终得分、排名或得到专业人士认可",d:{spark:2,heart:1}},{t:"把复杂现象抽丝剥茧，提炼成可迁移的模型",d:{logic:2,order:1}},{t:"找到能立即用于现实工作的具体方法",d:{pace:1,logic:1}}],why:"内化成自己的东西才算最大的收获。"},{id:"w36",s:2,focus:"质量意识与主动补位",q:"团队成员交付的内容明显在蒙混过关，已经影响整体质量。你会怎样做？",opts:[{t:"指出具体问题并给出修改建议，必要时协助对方补齐",d:{logic:1,spark:1,heart:1}},{t:"同步给负责人，由负责人决定是否返工和追责",d:{spark:1,order:1,heart:-1}},{t:"优先管好自己的部分，避免被他人的问题拖住",d:{heart:-1,spark:-2,order:-1}}],why:"求求了，我来帮你，你别摸鱼了。"},{id:"w37",s:2,focus:"风险决策与止损机制",q:"推进中的计划被评估为失败风险较高，但尚未完全证伪。你会怎样处理？",opts:[{t:"愿意赌一把，万一成功收益足够大",d:{risk:2,pace:1}},{t:"按预先设定的风险信号及时掉头，启动备用方案",d:{risk:-1,logic:1,order:1,pace:1}},{t:"缩小投入做一次低成本验证，再决定去留",d:{logic:2,order:1,risk:1}}],why:"不爱赌。"},{id:"w38",s:2,focus:"情绪边界与抗压方式",q:"连续受挫、工作情绪积累到需要释放时，你更倾向怎样处理？",opts:[{t:"及时表达出来，不希望情绪长期压在心里",d:{heart:2,spark:1}},{t:"先处理完紧急问题，独处时再消化和复盘情绪",d:{heart:-1,order:1,pace:1}},{t:"尽量不让别人察觉，用工作继续往前推",d:{heart:-2,pace:1,spark:-1}}],why:"被人拿捏和暴露脆弱，是我的大忌。"},{id:"w39",s:2,focus:"恢复方式与状态切换",q:"结束一个高强度阶段后，你更倾向用哪类内容帮助自己切换状态？",opts:[{t:"轻松、无负担的喜剧或娱乐内容",d:{pace:-1,heart:1}},{t:"逻辑严密的悬疑或剧情作品，继续保持思考",d:{logic:2,order:1}},{t:"先复盘刚结束的工作，把经验整理完再休息",d:{order:2,logic:1}}],why:"生活已经挺苦了。"},{id:"w40",s:2,focus:"认可偏好与内在驱动",q:"如果只能选择一种来自同事或上级的认可，你更希望是哪一种？",opts:[{t:"“你非常努力、很能吃苦。”",d:{heart:1,spark:-1,pace:1}},{t:"“你脑子好使、逻辑清晰、判断可靠。”",d:{logic:2,spark:1}},{t:"“你很会照顾团队氛围，和你合作很舒服。”",d:{heart:2,spark:1}}],why:"我需要的是智识上的认可。"}],k0=[{id:"l1",s:1,focus:"出行节奏与兴趣锚点",q:"和一个新认识的朋友去陌生城市玩两天，你更想怎么安排路线？",opts:[{t:"按攻略把著名景点挨个打卡，行程排满更踏实",d:{order:2,pace:1,risk:-1}},{t:"不硬排景点，走到哪算哪，把时间留给真正想逛的地方",d:{risk:1,order:-2,pace:-1}},{t:"先约好吃饭和交通，中间留给彼此各自的小兴趣",d:{heart:1,order:1}}],why:"不爱看景点，旅游的锚点其实是逛古着店。虽然买了也不一定穿，但控制住了。"},{id:"l2",s:1,focus:"日常出行偏好",q:"和朋友出门，距离不算远、也不赶时间时，你更想怎么走？",opts:[{t:"打车，省事、准点、少消耗",d:{pace:2,order:1,heart:-1}},{t:"坐地铁，不堵车，时间好估",d:{order:2,pace:1}},{t:"坐公交，能看街景，也更自由、不那么挤",d:{risk:1,heart:1,pace:-1}}],why:"坐公交看城市流动，比闷在地铁里强多了。"},{id:"l3",s:1,focus:"精力与尝试意愿",q:"朋友突然约你去试一个从没玩过的活动，你的第一反应更接近？",opts:[{t:"先估自己今晚还能撑多久，再决定去不去",d:{order:1,pace:-1}},{t:"只要身体还行，就想去试试",d:{risk:2,pace:2,spark:1}},{t:"能去最好，但更在意能不能准时回家睡觉",d:{order:1,heart:-1}}],why:"学校不让骑电动车，硬是把我逼成了一个“竞走选手”。"},{id:"l4",s:1,focus:"共同兴趣与陪伴方式",q:"和朋友一起听歌或通勤时，你的歌单里更常出现哪类？",opts:[{t:"歌词很满、情绪很浓的抒情慢歌",d:{heart:2,spark:1,pace:-1}},{t:"节奏很稳、鼓点密的 R&B 或嘻哈",d:{pace:2,order:1,heart:-1}},{t:"纯音乐，当背景就好",d:{order:1,spark:-1}}],why:"我喜欢跟着节奏抖腿，朋友说我念《Alexander Hamilton》像念经，但我快会背了。"},{id:"l5",s:1,focus:"疲惫时的恢复方式",q:"这一周过得很累，晚上只想随便看点东西，你会选哪类？",opts:[{t:"烧脑悬疑，刺激一下神经",d:{logic:1,risk:1,pace:1}},{t:"轻松愉快的，比如《生活大爆炸》这类",d:{heart:1,pace:-1}},{t:"深刻、压抑一点的文艺片",d:{logic:1,spark:-1,heart:-1}}],why:"生活已经挺苦了，看《被讨厌的勇气》我啥也没学到，还是看谢尔顿搞笑比较治愈。"},{id:"l6",s:1,focus:"尝试新事物时需要的陪伴",q:"你突然很想试攀岩、拳击或普拉提，这时最容易让你真的踏出门的是？",opts:[{t:"先收藏起来，等自己准备好再说",d:{risk:-2,pace:-1,order:1}},{t:"一个人去体验就好，不需要别人在场",d:{heart:-2,risk:1}},{t:"只要有人陪，我不太会犹豫，直接冲",d:{heart:2,risk:2,pace:1}}],why:"只要时机合适，或者陪我一起，我什么新事物都想试。"},{id:"l7",s:1,focus:"生活投入与分享点",q:"和朋友聊天时，你最近的购物更像哪种状态？",opts:[{t:"缺什么买什么，用完再补",d:{order:1,logic:1,spark:-1}},{t:"正在认真供养某个爱好，买的都跟它有关",d:{spark:1,risk:1,order:1}},{t:"能不买就不买，东西越少越轻松",d:{order:2,risk:-1}}],why:"上大学前买资料的钱快赶上学费了，上大学后开始研究穿搭。"},{id:"l8",s:1,focus:"冲突处理与搭子分工",q:"和朋友去吃饭，招牌菜难吃到离谱，你更可能怎么做？",opts:[{t:"吃完就算了，这家以后不来",d:{pace:1,spark:-1,heart:-1}},{t:"回去发个避雷，提醒别人别踩",d:{spark:2,logic:1}},{t:"找店长把问题说清楚，能退换就退换",d:{spark:2,order:1,logic:1}}],why:"给我一个C型朋友，我保证不拖后腿。"},{id:"l9",s:1,focus:"社交电量",q:"一个几乎全是陌生人的聚会，你的能量通常会怎样走？",opts:[{t:"越聊越热，离开时还想再续一摊",d:{heart:2,spark:2,pace:1}},{t:"很快耗空，只想找角落或提前走",d:{heart:-2,spark:-1}},{t:"前面能玩得很疯，后面会突然断电",d:{heart:1,pace:1,order:-1}}],why:"我不是故意的，没表情不等于心情不好。"},{id:"l10",s:1,focus:"交友启动方式",q:"判断“这个人能不能做朋友”时，你第一眼最在意什么？",opts:[{t:"对方看起来是否成熟、聪明，聊得动",d:{logic:2,spark:1}},{t:"对方会不会主动，愿不愿意先迈出第一步",d:{heart:1,spark:-1,order:1}},{t:"对方的长相、气质和穿搭是否对得上眼",d:{spark:1,heart:1}}],why:"我是个没什么安全感的人，你主动，我一定能回应。"},{id:"l11",s:1,focus:"关心的表达方式",q:"朋友发了一条“今天好累，谁懂啊”，没有下文。你会怎么处理？",opts:[{t:"点个赞，留一句抱抱就好",d:{heart:1,spark:-1}},{t:"很想知道具体情况，好判断能不能帮上忙",d:{logic:2,order:1,heart:1}},{t:"先划过，等对方真的来找再说",d:{spark:-2,heart:-1}}],why:"没有具体情况无从下手啊，但我不敢去问。"},{id:"l12",s:1,focus:"被看见时的边界",q:"你穿了一套自己很喜欢、但有点夸张的衣服出门，对别人的目光你会？",opts:[{t:"非常敏感，走路都会拘谨一点",d:{spark:-1,heart:-1,order:1}},{t:"不太在乎，穿给自己看的",d:{spark:1,risk:1}},{t:"其实有点希望被夸",d:{heart:2,spark:1}}],why:"我真的好在意别人的眼光，但我在改进了。"},{id:"l13",s:1,focus:"评价他人时的立场",q:"朋友跟你八卦说“那个人性格好奇葩”，你更可能怎么接？",opts:[{t:"顺着一起吐槽，当聊天佐料",d:{spark:2,heart:1,logic:-1}},{t:"先从对方角度想想：是不是有什么经历让他变成这样",d:{logic:2,order:1,spark:-1}},{t:"兴趣不大，把话题转走",d:{spark:-1,heart:-1}}],why:"我喜欢中立地思考，人的行为总是有底层逻辑的。"},{id:"l14",s:1,focus:"仪式感与精力分配",q:"朋友很看重节日和仪式感，约你一起过。你真实的态度更接近？",opts:[{t:"很看重，能过的节日都想认真过",d:{heart:2,order:1,spark:1}},{t:"不太在意日期本身，有没有仪式都行",d:{order:-1,spark:-1,heart:-1}},{t:"可以陪，但要看当天状态，别占掉太多精力",d:{heart:1,order:1}}],why:"我可以陪你过的，也能玩得很开心，但我确实从来不记日子。"},{id:"l15",s:1,focus:"独处恢复",q:"忙完一天、已经很疲惫的深夜，你通常会？",opts:[{t:"倒头就睡，不想再接收信息",d:{pace:-2,order:1}},{t:"再刷一会儿手机，让脑子慢慢停下来",d:{pace:-1,spark:1}},{t:"听歌、看电视或看一点书，给自己收个尾",d:{order:1,logic:1,heart:-1}}],why:"忙完感觉时间没浪费，就能很平静地看电视了。"},{id:"l16",s:2,focus:"友谊中的安全感",q:"在一段你很在意的长期友谊里，你最怕自己处于哪种位置？",opts:[{t:"被忽视，好像可有可无",d:{heart:2,spark:1}},{t:"被拿捏，感觉自己处于弱势",d:{order:1,spark:1,heart:-1}},{t:"投入得太深，收不回来",d:{heart:1,risk:-1}}],why:"我需要确定你对我的在意程度，高于或等于我对你的在意程度。"},{id:"l17",s:2,focus:"主动权与防御",q:"你觉得这个人不错，但他一直不约你、也不表态。你会怎么做？",opts:[{t:"憋不住，主动去问清楚",d:{spark:2,pace:1,heart:1}},{t:"先退出一点，进入防御，等对方先开口",d:{spark:-1,order:1,heart:-1}},{t:"表面上不当回事，心里反复复盘",d:{logic:1,spark:-1,heart:-1}}],why:"被人拿捏和暴露脆弱，是我的大忌。"},{id:"l18",s:2,focus:"被吸引的核心特质",q:"长期做朋友，你更容易被对方哪一点吸引？",opts:[{t:"愿意时刻在，需要时就能找到",d:{heart:2,order:1}},{t:"脑子好使，能接住你的逻辑",d:{logic:2,spark:1}},{t:"给你很大的自由和空间，不黏",d:{heart:-1,risk:1}}],why:"我想找个万能搭子。"},{id:"l19",s:2,focus:"冲突修复方式",q:"和好朋友闹别扭之后，你最受不了哪种处理？",opts:[{t:"当面吵开，把话说完",d:{spark:2,pace:1}},{t:"用送礼、请客来代替把事情讲清楚",d:{heart:1,logic:-1}},{t:"冷战，不回消息，也不说卡在哪",d:{order:-2,spark:-2,heart:-1}}],why:"大忌，没有进度条的等待，我会发疯。"},{id:"l20",s:2,focus:"支持朋友的方式",q:"朋友跟你说自己被不公平对待了，你更自然的反应是？",opts:[{t:"先站队，一起把那个让他受委屈的人骂一顿",d:{heart:2,spark:1,logic:-1}},{t:"帮他看原因，一起想下次怎么避免、怎么处理",d:{logic:2,order:1}},{t:"先陪着，等他想听建议再开口",d:{heart:1,pace:-1}}],why:"争取这种事情不会再发生第二次。"},{id:"l21",s:2,focus:"道德绑架与边界",q:"有人用示弱或“你应该懂事”来让你让步，你通常会？",opts:[{t:"心一软，先答应下来",d:{heart:2,spark:-1}},{t:"拉开距离，先把自己保护住",d:{order:1,heart:-1,spark:1}},{t:"觉得这套完全没道理，心里会很排斥",d:{logic:2,spark:2,heart:-1}}],why:"完全没道理的话能不能别说，我替你丢脸。"},{id:"l22",s:2,focus:"共同娱乐时的角色",q:"理想的观影搭子，看完电影后更对你胃口的是？",opts:[{t:"情绪很满，能一起哭、一起沉浸",d:{heart:2,spark:1}},{t:"愿意听你吐槽剧情漏洞和底层逻辑",d:{logic:2,spark:1}},{t:"一起看轻松喜剧，笑完就行",d:{heart:1,pace:1}}],why:"我看电视属于吐槽役，我妈受不了我。"},{id:"l23",s:2,focus:"关系焦虑时的反应",q:"友谊里突然很不安时，你的本能更接近？",opts:[{t:"连续发消息，确认对方还在不在",d:{heart:2,spark:2,pace:1}},{t:"强迫自己冷静，把注意力挪走",d:{order:1,spark:-1,heart:-1}},{t:"把现状摊开来看：发生了什么、我能确认什么",d:{logic:2,order:1}}],why:"死也要死得明明白白。"},{id:"l24",s:2,focus:"被误解时的回应",q:"有人对你说“你能不能别这么理智，像机器人”，你会？",opts:[{t:"觉得被误会了，想解释清楚自己不是那样",d:{spark:1,heart:1}},{t:"觉得对方太感性，缺一点底层逻辑",d:{logic:2,spark:1,heart:-1}},{t:"不反驳，只当他还不了解你",d:{spark:-1,order:1,heart:-1}}],why:"说出这话说明你瞎。"},{id:"l25",s:2,focus:"记仇与翻篇",q:"朋友后来问起“你会不会记仇”，你更接近哪种？",opts:[{t:"会，谁惹过我，印象很难消",d:{order:1,spark:1,heart:-1}},{t:"不太记仇，但会复盘；想明白了就自己把气消掉",d:{logic:2,order:1}},{t:"看心情，当天状态好就算了",d:{pace:1,order:-1}}],why:"我不怎么记事，只记得自己丢脸的瞬间。"},{id:"l26",s:2,focus:"长期挚友画像",q:"如果只能选一种人做长期挚友，你会更倾向？",opts:[{t:"情绪稳定、边界清楚，关键时刻能兜底",d:{order:2,logic:1,heart:1}},{t:"价值观和审美跟你几乎一模一样",d:{spark:1,heart:1,logic:1}},{t:"能包容你的小毛病，并且不会轻易走开",d:{heart:2,order:1}}],why:"我需要一个能说出“我在”的人。"},{id:"l27",s:2,focus:"看到低效时的干预",q:"好朋友正在做一件你觉得特别低效的事，你更可能？",opts:[{t:"不管，让他自己摸索",d:{heart:-1,spark:-1,risk:1}},{t:"看不下去，直接上手帮他做完",d:{pace:2,spark:1,heart:1}},{t:"先教一遍，希望他下次按更顺的方法来",d:{logic:1,order:1,spark:1}}],why:"我真忍不住。"},{id:"l28",s:2,focus:"高压下需要的陪伴",q:"你处在很大的压力里时，最希望好朋友怎样待你？",opts:[{t:"把生活起居都照顾好，让你少费神",d:{heart:2,order:1}},{t:"给你绝对空间，让你一个人把情绪处理完",d:{heart:-2,spark:-1}},{t:"就站在旁边，和你一起面对这件事",d:{heart:1,order:1,spark:1}}],why:"陪伴是最大的帮助。"},{id:"l29",s:2,focus:"生活方式",q:"你更想和朋友一起过哪种日子？",opts:[{t:"稳定安逸，作息清楚，少折腾",d:{order:1,pace:-2,risk:-1}},{t:"持续学新东西，隔一段时间就想试点没试过的",d:{risk:2,pace:1,spark:1}},{t:"随遇而安，计划不必太满",d:{order:-2,pace:-1}}],why:"攀岩、拳击、普拉提、Vibe Coding……我什么都想试试。"},{id:"l30",s:2,focus:"事业投入被误解时",q:"朋友因为你没陪他而不高兴，而你其实在为自己后面的计划做研究或写东西。你会？",opts:[{t:"先放下手头的事，去把人哄好",d:{heart:2,spark:1,pace:-1}},{t:"把原因说清楚：我在给后面的生活质量打基础",d:{logic:2,spark:1,order:1}},{t:"觉得对方不懂事，心里会有点累",d:{spark:-1,heart:-1}}],why:"我 get 不到生气的点其实。"},{id:"l31",s:2,focus:"在意的表达",q:"你更希望朋友用哪种方式告诉你“我很在意你”？",opts:[{t:"经常把在意说出来",d:{spark:2,heart:2}},{t:"用行动证明：帮你解决麻烦，或把你真正需要的东西补上",d:{logic:1,order:1,heart:1}},{t:"在你想独处时递一杯东西，然后安静离开",d:{heart:-1,order:1,spark:-1}}],why:"做点实事说明你在意我。"},{id:"l32",s:2,focus:"公开情绪的边界",q:"朋友发了一条很私密、情绪很冲的动态，你更可能？",opts:[{t:"马上私聊安慰",d:{heart:2,spark:1}},{t:"先当没看见，或只在心里过一下",d:{spark:-1,order:1,heart:-1}},{t:"点进去看完，但不公开评论",d:{heart:1,spark:-1}}],why:"我感觉这是一个很不安全的行为。"},{id:"l33",s:2,focus:"面对他人过去的错误",q:"朋友向你坦白以前做过一件错事，你更自然的反应是？",opts:[{t:"心里会往后退，重新评估这个人",d:{order:1,heart:-1,spark:1}},{t:"先看当时的处境，再判断这件事还会不会再发生",d:{logic:2,order:1}},{t:"过去就过去了，不必反复翻",d:{heart:1,pace:1,order:-1}}],why:"有理由我就不在意。"},{id:"l34",s:2,focus:"关系确认感",q:"什么时候你会觉得这段友谊“稳了”？",opts:[{t:"发现对方已经能接住你的脾气和冷水",d:{spark:1,heart:1}},{t:"双方在重要事情上能达成一致",d:{logic:2,order:1}},{t:"能感觉到对方不会轻易把你放下",d:{heart:2,order:1}}],why:"我需要你让我有安全感。"},{id:"l35",s:2,focus:"脆弱被看见",q:"一个平时很克制的朋友，突然在你面前哭得很凶。你会觉得？",opts:[{t:"有点手足无措，不知道第一句该说什么",d:{spark:-1,heart:1}},{t:"对方愿意卸下防御，说明对你是放心的",d:{heart:2,order:1}},{t:"想立刻帮他分析，把痛苦拆开处理",d:{logic:2,spark:1}}],why:"能让我看到脆弱，说明你对我完全放心了。"},{id:"l36",s:2,focus:"舒服的相处场景",q:"理想的周末和朋友待在一起，你更想要哪种？",opts:[{t:"出门好好吃一顿，把气氛做足",d:{spark:1,heart:2,order:1}},{t:"出去随便走走，没有明确目的",d:{risk:1,pace:1,order:-1}},{t:"在家各干各的，偶尔抬头聊两句",d:{heart:-1,order:1}}],why:"舒服最重要。"},{id:"l37",s:2,foc e:"./images/roots/story1.jpg",imageAlt:"外婆家院子里，四五岁的小女孩和一只母鸡大眼瞪小眼，脸上粘着一粒米饭，鸡正伸长脖子去啄。",body:["脸上有几道疤痕，来历大抵是猜不到的。四五岁那会儿，人还没长开，个头跟外婆家的鸡差不多高。偏偏脸上沾了米粒，便遭了鸡啄。难怪小时候不爱吃鸡，如今算是狠狠报复回来了。前阵子发了张照片，脸颊上刚好带着疤，倒叫人寻着了这张“战损照”。"],facts:[]},{id:"r-bamboo",side:"root",x:290,y:560,year:"8岁",title:"自制小窝",tag:"",symbol:"🎋",summary:"外婆家后山有片竹林，藤蔓生得极茂盛。八岁那年，跟姐姐弟弟们扯了藤蔓，在粗壮的竹子间做秋千。",image:"./images/roots/story2.jpg",imageAlt:"竹林里，两根粗壮的竹子之间用藤蔓缠绑了一张网兜式的秋千，八岁的女孩和姐姐弟弟们躺在藤网里。",body:["外婆家后山有片竹林，藤蔓生得极茂盛。八岁那年，跟姐姐弟弟们扯了藤蔓，在粗壮的竹子间做秋千。说是秋千，其实压根摇不动，充其量也就是个吊床罢了。"],facts:[]},{id:"r-school",side:"root",x:-320,y:800,year:"入学",title:"被 “留级” 的羞耻",tag:"",symbol:"🔁",summary:"晚一年上小学，全因生在九月三十日，卡在政策月限之后。但我妈当时骗人，说是由于在中班太不听话，给留了级。",image:"./images/roots/story3.jpg",imageAlt:"一个小女孩背着小书包站在小学校门口，抬头向往地望着校园。",body:["晚一年上小学，全因生在九月三十日，卡在政策月限之后。但我妈当时骗人，说是由于在中班太不听话，给留了级。小时候确实“人嫌狗厌”，这理由很合情理，也就信了。只是心里到底觉着有点小羞耻——怎么偏就我留了级呢？"],facts:[]},{id:"r-lost",side:"root",x:300,y:1060,year:"7，8岁",title:"走在最前面的代价",tag:"",symbol:"🚪",summary:"七八岁时，住处离步行街很近。那时人很孤傲，走路总要独自抢在最前头。及至与家人走散……",image:"./images/roots/story4.jpg",imageAlt:"夜晚的单元楼门口，七八岁的女孩抱膝蹲在防盗门前，隔壁叔叔从窗内探出身来。",body:["七八岁时，住处离步行街很近。那时人很孤傲，走路总要独自抢在最前头。及至与家人走散，按我妈后来的话说，是有病。寻常小孩走散，多在原地大哭等爹妈。我不哭，觉着丢了面子，自顾自走回家。七八点钟走散的，没带钥匙，就在家门口蹲了差不多三个钟头。直到隔壁叔叔露面，才借了手机打给家里。我妈说，那会儿他们都报警了。真是对不住啊，警察叔叔。"],facts:[]},{id:"r-ice",side:"root",x:-270,y:1320,year:"10岁",title:"靠脂肪完成自救",tag:"",symbol:"🧊",summary:"十岁那年冬，后山小湖结了冰。一双脚闲不住，去踩冰面，果然落了水。",image:"./images/roots/story5.jpg",imageAlt:"冬日后山小湖的冰面破了一个洞，十岁的女孩半个身子泡在水里，双臂撑在冰缘上，神情淡定。",body:["十岁那年冬，后山小湖结了冰。一双脚闲不住，去踩冰面，果然落了水。唯一有“实力”把咱捞上来的姐姐恰好在湖对岸。心里慌了一下，正打算原地候着救援，只是姐姐迟迟不动，稍一琢磨，发现自己其实就浮在湖边上，索性自个儿爬了上去。"],facts:[]},{id:"r-hands",side:"root",x:250,y:1580,year:"高中",title:"不用暖宝宝的原因",tag:"",symbol:"🧻",summary:"不知旁人有没这习惯，左右我这手是闲不住的，活脱脱一个粉碎机转身。",image:"./images/roots/story6.jpg",imageAlt:"高中教室里，穿校服的女孩两手都是暖宝宝里的粉末，桌上是被撕开豁口的暖宝宝。",body:["不知旁人有没这习惯，左右我这手是闲不住的，活脱脱一个粉碎机转身。高中时从不备暖宝宝，不到十分钟准给撕个稀烂；纸巾也是，总忍不住扯成条，攥在手里没一会又揪成片。碎纸机若是坏了，找我准没错，功能是一样的。"],facts:[]},{id:"r-zodiac",side:"root",x:-235,y:1840,year:"
